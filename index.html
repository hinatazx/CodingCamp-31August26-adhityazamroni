<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <div class="dashboard">

      <!-- Top Bar: greeting + theme toggle -->
      <div class="top-bar">
        <!-- Greeting Widget -->
        <header>
          <section id="greeting-widget" aria-label="Greeting">
            <p id="greeting-text"></p>
            <p id="greeting-time" aria-live="polite"></p>
            <p id="greeting-date"></p>
            <!-- Name edit inline form -->
            <div class="name-edit-row" id="name-display-row">
              <span id="greeting-name-label"></span>
              <button id="name-edit-btn" type="button" class="btn-ghost btn-sm" aria-label="Edit your name">✎ Edit name</button>
            </div>
            <div class="name-edit-row name-edit-form" id="name-edit-form" hidden>
              <label for="name-input" class="sr-only">Your name</label>
              <input id="name-input" type="text" placeholder="Enter your name…" maxlength="50" autocomplete="off" />
              <button id="name-save-btn" type="button" class="btn-sm">Save</button>
              <button id="name-cancel-btn" type="button" class="btn-ghost btn-sm">Cancel</button>
              <span id="name-error" role="alert" class="error-message"></span>
            </div>
            <span id="greeting-error" role="alert" class="error-message" hidden></span>
          </section>
        </header>

        <!-- Theme Toggle -->
        <div class="theme-toggle-wrap">
          <button id="theme-toggle" type="button" class="btn-theme-toggle" aria-label="Switch to light mode" title="Toggle theme">
            <span class="theme-icon" aria-hidden="true">☀️</span>
          </button>
        </div>
      </div>

      <main>

        <!-- Focus Timer Widget -->
        <section id="focus-timer-widget" aria-label="Focus Timer">
          <h2 class="widget-title">Focus Timer</h2>
          <div id="timer-display" aria-live="polite" aria-label="Remaining time">25:00</div>
          <div id="timer-completion" role="status" class="timer-completion" hidden>
            Session complete! Great work.
          </div>
          <div class="timer-controls">
            <button id="timer-start" type="button">Start</button>
            <button id="timer-stop" type="button" disabled>Stop</button>
            <button id="timer-reset" type="button">Reset</button>
          </div>
          <span id="timer-error" role="alert" class="error-message" hidden></span>
        </section>

        <!-- To-Do List Widget -->
        <section id="todo-list-widget" aria-label="To-Do List">
          <h2 class="widget-title">To-Do List</h2>
          <div class="todo-input-row">
            <label for="todo-input" class="sr-only">New task title</label>
            <input
              id="todo-input"
              type="text"
              placeholder="Add a new task…"
              aria-describedby="todo-input-error"
            />
            <button id="todo-add-btn" type="button">Add</button>
          </div>
          <span id="todo-input-error" role="alert" class="error-message"></span>
          <ul id="todo-list" aria-label="Task list"></ul>
          <span id="todo-quota-error" role="alert" class="error-message" hidden></span>
        </section>

        <!-- Quick Links Widget -->
        <section id="quick-links-widget" aria-label="Quick Links">
          <h2 class="widget-title">Quick Links</h2>
          <div class="links-form">
            <label for="link-label-input" class="sr-only">Link label</label>
            <input
              id="link-label-input"
              type="text"
              placeholder="Label"
              maxlength="100"
              aria-describedby="link-label-error"
            />
            <span id="link-label-error" role="alert" class="error-message"></span>

            <label for="link-url-input" class="sr-only">Link URL</label>
            <input
              id="link-url-input"
              type="url"
              placeholder="https://example.com"
              maxlength="2048"
              aria-describedby="link-url-error"
            />
            <span id="link-url-error" role="alert" class="error-message"></span>

            <button id="link-add-btn" type="button">Add Link</button>
            <span id="link-limit-error" role="alert" class="error-message"></span>
          </div>
          <div id="links-list" aria-label="Saved links"></div>
          <span id="links-quota-error" role="alert" class="error-message" hidden></span>
          <span id="links-load-error" role="alert" class="error-message" hidden></span>
        </section>

      </main>
    </div><!-- /.dashboard -->
  </body>
</html>
